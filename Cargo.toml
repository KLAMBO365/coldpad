[workspace]
members = ["coldpad-core", "coldpad"]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rand = "0.8"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
argon2 = "0.5"
aes-gcm = "0.10"
console = "0.16.3"
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
